[package]
name = "limitbook-cli"
description = "CLI for limitbook: fixture generation, feed replay, and benchmarking"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "limitbook"
path = "src/main.rs"

[dependencies]
limitbook-core = { path = "../limitbook-core" }
flate2 = "1"
# Sampling CPU profiler for `bench --flamegraph` (signal/timer based, works
# in containers without perf_event access). Optional so plain builds carry
# no profiler.
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

[features]
# Enables `limitbook bench --flamegraph <out.svg>`.
profiling = ["dep:pprof"]
