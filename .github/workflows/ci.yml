name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # limitbook-core must stay pure computation: no file/OS I/O and no
      # dependencies that block a wasm32 target (it powers the browser demo).
      # Building limitbook-wasm builds core as a dependency, and keeps the
      # browser glue crate compiling for its actual target.
      - name: Core + wasm glue build for wasm32
        run: |
          cargo build -p limitbook-core --target wasm32-unknown-unknown
          cargo build -p limitbook-wasm --target wasm32-unknown-unknown
